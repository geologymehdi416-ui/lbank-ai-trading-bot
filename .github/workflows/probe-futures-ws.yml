
name: Probe LBank Futures WebSocket

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WebSocket client
        run: python -m pip install --upgrade websocket-client

      - name: Test Futures WebSocket topics 11, 12 and 13
        run: |
          python -u ws_test.py
