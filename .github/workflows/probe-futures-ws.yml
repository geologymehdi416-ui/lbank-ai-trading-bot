name: Probe LBank Futures WebSocket

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WebSocket client
        run: pip install websocket-client

      - name: Test Futures WebSocket
        run: |
          python - <<'PY'
          import websocket
          import time

          url = "wss://lbkperpws.lbank.com/ws"
          print("Connecting to LBank Futures...")
          ws = websocket.create_connection(url, timeout=8)
          print("WEBSOCKET_HANDSHAKE=SUCCESS")

          deadline = time.time() + 15
          received = 0

          try:
              while time.time() < deadline:
                  try:
                      message = ws.recv()
                      if message:
                          received += 1
                          print("SERVER_FRAME", received, str(message)[:1500])
                  except websocket.WebSocketTimeoutException:
                      break
          finally:
              ws.close()

          print("SERVER_FRAMES_RECEIVED=", received)
          PY