
name: LBank Futures Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: lbank-futures-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy websockets

      - name: Check Python files
        run: |
          python -m py_compile collector.py
          python -m py_compile sniper_entry.py
          python -m py_compile signal_scanner.py
          python -m py_compile ws_probe.py

      - name: Collect LBank Futures data
        run: |
          python -u collector.py

      - name: Probe WebSocket
        id: websocket
        continue-on-error: true
        run: |
          python -u ws_probe.py

      - name: Run Futures scanner
        env:
          LBANK_FUTURES_CANDLE_URL: ${{ secrets.LBANK_FUTURES_CANDLE_URL }}
        run: |
          python -u sniper_entry.py

      - name: Filter signals
        run: |
          python -u signal_scanner.py

      - name: Send Telegram report
        if: always() && hashFiles('data/final_signals.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Telegram secrets are missing")
              raise SystemExit(0)

          with open(
              "data/final_signals.json",
              encoding="utf-8"
          ) as f:
              signals = json.load(f)

          if not signals:
              message = (
                  "LBank Futures Scanner\n\n"
                  "NO SETUP - DO NOT ENTER"
              )
          else:
              lines = [
                  "LBank Futures Scanner",
                  "--------------------"
              ]

              for s in signals:
                  lines.extend([
                      f"Symbol: {s['symbol']}",
                      f"Direction: {s['direction']}",
                      f"Entry: {s['entry']}",
                      f"Stop Loss: {s['stop_loss']}",
                      f"Take Profit: {s['take_profit']}",
                      f"RR: {s['rr']}",
                      f"Quality: {s.get('quality_score', 'N/A')}",
                      "--------------------"
                  ])

              message = "\n".join(lines)

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=20
          )

          response.raise_for_status()
          print("Telegram report sent")
          PY
