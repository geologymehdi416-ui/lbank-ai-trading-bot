
name: LBank Futures Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: lbank-futures-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Collect LBank Futures data
        run: |
          python collector.py

      - name: Run scanner
        env:
          LBANK_FUTURES_CANDLE_URL: ${{ secrets.LBANK_FUTURES_CANDLE_URL }}
        run: |
          python sniper_entry.py

      - name: Send Telegram report
        if: always() && hashFiles('data/signals.json') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Telegram secrets are missing")
              raise SystemExit(0)

          with open("data/signals.json", encoding="utf-8") as f:
              signals = json.load(f)

          if not signals:
              message = "LBank Futures Scanner\n\nNO SETUP - DO NOT ENTER"
          else:
              lines = ["LBank Futures Scanner", ""]

              for s in signals:
                  lines.extend([
                      f"{s['symbol']} | {s['direction']}",
                      f"Entry: {s['entry']}",
                      f"SL: {s['stop_loss']}",
                      f"TP: {s['take_profit']}",
                      f"RR: {s['rr']}",
                      f"RSI 15m: {s['rsi_15m']}",
                      f"Volume ratio: {s['volume_ratio']}",
                      "--------------------"
                  ])

              message = "\n".join(lines)

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=15
          )

          response.raise_for_status()
          print("Telegram report sent")
          PY
