name: LBank Futures Smart Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lbank-futures-scanner
  cancel-in-progress: false

jobs:

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Collect Futures prices
        run: python collector.py

      - name: Analyze market
        run: python signal_scanner.py

      - name: Send Telegram Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from pathlib import Path

          report = Path("report.txt").read_text(encoding="utf-8")

          response = requests.post(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": report
              },
              timeout=20
          )

          print(response.text)
          response.raise_for_status()
          PY

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.jsonl

          if ! git diff --cached --quiet; then
            git commit -m "Update LBank Futures price history"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No new data"
          fi

  websocket_probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WebSocket dependency
        run: pip install websocket-client

      - name: Probe Futures subscription protocol
        run: |
          python - <<'PY'
          import json
          import time
          import websocket

          URL = "wss://lbkperpws.lbank.com/ws"

          probes = [
              {
                  "name": "KLINE_REQUEST",
                  "payload": {
                      "action": "request",
                      "request": "kbar",
                      "kbar": "5min",
                      "pair": "BTCUSDT",
                      "size": "2"
                  }
              },
              {
                  "name": "KLINE_SUBSCRIBE",
                  "payload": {
                      "action": "subscribe",
                      "subscribe": "kbar",
                      "kbar": "5min",
                      "pair": "BTCUSDT"
                  }
              },
              {
                  "name": "TRADE_SUBSCRIBE",
                  "payload": {
                      "action": "subscribe",
                      "subscribe": "trade",
                      "pair": "BTCUSDT"
                  }
              }
          ]

          for probe in probes:
              print("\n================================")
              print("TEST:", probe["name"])
              print("================================")

              ws = None

              try:
                  ws = websocket.create_connection(
                      URL,
                      timeout=10,
                      enable_multithread=True
                  )

                  print("HANDSHAKE_OK")

                  message = json.dumps(probe["payload"])
                  print("SEND:", message)

                  ws.send(message)
                  ws.settimeout(2)

                  end_time = time.time() + 12
                  received = 0

                  while time.time() < end_time:
                      try:
                          frame = ws.recv()

                          if frame:
                              received += 1
                              print("SERVER_RESPONSE:", frame)

                      except websocket.WebSocketTimeoutException:
                          continue

                  print("FRAME_COUNT:", received)

                  if received == 0:
                      print("NO_RESPONSE")

              except Exception as error:
                  print("PROBE_ERROR:", repr(error))

              finally:
                  if ws:
                      ws.close()

          print("\nALL_PROBES_FINISHED")
          PY