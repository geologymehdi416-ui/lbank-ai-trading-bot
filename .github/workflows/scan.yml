name: LBank Futures Smart Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lbank-price-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests
      - name: Get Telegram Channel ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"
          data = requests.get(url, timeout=20).json()

          for update in data.get("result", []):
              post = update.get("channel_post")
              if post:
                  print("CHANNEL ID:", post["chat"]["id"])
          PY
      - name: Collect Futures prices
        run: python collector.py

      - name: Technical Analysis
        run: python signal_scanner.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Update LBank Futures price history"
            git push
          else
            echo "No new data"
          fi