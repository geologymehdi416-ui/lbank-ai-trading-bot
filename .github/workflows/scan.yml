name: LBank Futures Smart Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lbank-futures-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Collect LBank Futures prices
        run: |
          python collector.py

      - name: Run smart scanner
        run: |
          python signal_scanner.py

      - name: Send Telegram report in multiple messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests
          from pathlib import Path

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              raise RuntimeError(
                  "Telegram secrets are missing"
              )

          report_file = Path("report.txt")

          if not report_file.exists():
              raise RuntimeError(
                  "report.txt was not generated"
              )

          report = report_file.read_text(
              encoding="utf-8"
          ).strip()

          if not report:
              raise RuntimeError(
                  "Telegram report is empty"
              )

          # تقسیم گزارش به پیام‌های زیر 3800 کاراکتر
          max_length = 3800
          chunks = []
          current = ""

          for line in report.splitlines():

              if len(line) > max_length:
                  raise RuntimeError(
                      "A report line exceeds Telegram message limit"
                  )

              candidate = (
                  current + "\n" + line
                  if current
                  else line
              )

              if len(candidate) > max_length:
                  chunks.append(current)
                  current = line
              else:
                  current = candidate

          if current:
              chunks.append(current)

          url = (
              f"https://api.telegram.org/"
              f"bot{token}/sendMessage"
          )

          total = len(chunks)

          for index, chunk in enumerate(chunks, start=1):

              prefix = (
                  f"📨 بخش {index}/{total}\n\n"
                  if total > 1
                  else ""
              )

              payload = {
                  "chat_id": chat_id,
                  "text": prefix + chunk
              }

              response = requests.post(
                  url,
                  json=payload,
                  timeout=30
              )

              response.raise_for_status()

              result = response.json()

              if not result.get("ok"):
                  raise RuntimeError(
                      f"Telegram error: {result}"
                  )

              print(
                  f"Telegram message "
                  f"{index}/{total} sent"
              )

              time.sleep(1)

          print(
              f"Successfully sent {total} Telegram messages"
          )
          PY

      - name: Save collected market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prices.jsonl

          if git diff --cached --quiet; then
            echo "No market data changes"
          else
            git commit -m "Update LBank futures market data"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi