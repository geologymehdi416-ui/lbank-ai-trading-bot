
name: LBank Futures Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: lbank-futures-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy websockets

      - name: Check Python files
        run: |
          python -m py_compile collector.py
          python -m py_compile sniper_entry.py
          python -m py_compile signal_scanner.py
          python -m py_compile ws_probe.py

      - name: Collect LBank Futures data
        run: |
          python -u collector.py

      - name: Probe WebSocket
        continue-on-error: true
        run: |
          python -u ws_probe.py

      - name: Check candle endpoint
        id: candle_config
        env:
          LBANK_FUTURES_CANDLE_URL: ${{ secrets.LBANK_FUTURES_CANDLE_URL }}
        run: |
          if [ -n "$LBANK_FUTURES_CANDLE_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Candle endpoint is configured"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Candle endpoint missing. Scanner will be skipped."
          fi

      - name: Run Futures scanner
        id: futures_scanner
        if: steps.candle_config.outputs.configured == 'true'
        env:
          LBANK_FUTURES_CANDLE_URL: ${{ secrets.LBANK_FUTURES_CANDLE_URL }}
        run: |
          python -u sniper_entry.py

      - name: Filter signals
        id: filter_signals
        if: steps.futures_scanner.outcome == 'success'
        run: |
          python -u signal_scanner.py

      - name: Send Telegram report
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CANDLE_CONFIGURED: ${{ steps.candle_config.outputs.configured }}
          SCANNER_OUTCOME: ${{ steps.futures_scanner.outcome }}
          FILTER_OUTCOME: ${{ steps.filter_signals.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              print("Telegram secrets are missing")
              raise SystemExit(0)

          configured = os.getenv("CANDLE_CONFIGURED")
          scanner = os.getenv("SCANNER_OUTCOME")
          filter_result = os.getenv("FILTER_OUTCOME")

          if configured != "true":
              message = (
                  "LBank Futures Scanner\n\n"
                  "CANDLE DATA NOT CONFIGURED\n"
                  "SCANNER NOT RUN\n"
                  "No trading signals generated."
              )

          elif scanner != "success":
              message = (
                  "LBank Futures Scanner\n\n"
                  "SCANNER FAILED\n"
                  "No valid trading signals available."
              )

          elif filter_result != "success":
              message = (
                  "LBank Futures Scanner\n\n"
                  "SIGNAL FILTER FAILED\n"
                  "No verified report available."
              )

          else:
              path = "data/final_signals.json"

              if not os.path.exists(path):
                  message = (
                      "LBank Futures Scanner\n\n"
                      "SIGNAL FILE NOT FOUND\n"
                      "Report unavailable."
                  )
              else:
                  with open(path, encoding="utf-8") as f:
                      signals = json.load(f)

                  if not signals:
                      message = (
                          "LBank Futures Scanner\n\n"
                          "NO SETUP - DO NOT ENTER"
                      )
                  else:
                      lines = [
                          "LBank Futures Scanner",
                          "--------------------"
                      ]

                      for s in signals:
                          lines.extend([
                              f"Symbol: {s['symbol']}",
                              f"Direction: {s['direction']}",
                              f"Entry: {s['entry']}",
                              f"Stop Loss: {s['stop_loss']}",
                              f"Take Profit: {s['take_profit']}",
                              f"RR: {s['rr']}",
                              f"Quality: {s.get('quality_score', 'N/A')}",
                              "--------------------"
                          ])

                      message = "\n".join(lines)

          response = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={
                  "chat_id": chat_id,
                  "text": message
              },
              timeout=20
          )

          response.raise_for_status()
          print("Telegram report sent")
          PY
