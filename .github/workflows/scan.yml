name: LBank Futures Smart Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Get Telegram Channel ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests
          import json

          token = os.environ["TELEGRAM_BOT_TOKEN"]

          response = requests.get(
              f"https://api.telegram.org/bot{token}/getUpdates",
              params={
                  "allowed_updates": json.dumps(["channel_post", "message"])
              },
              timeout=20
          )

          print("HTTP STATUS:", response.status_code)

          data = response.json()
          print("TELEGRAM OK:", data.get("ok"))

          if not data.get("ok"):
              print("ERROR:", data.get("description"))
          else:
              updates = data.get("result", [])
              print("UPDATES FOUND:", len(updates))

              for update in updates:
                  post = update.get("channel_post")
                  if post:
                      print("CHANNEL ID:", post["chat"]["id"])
                      print("CHANNEL TITLE:", post["chat"].get("title"))
          PY

      - name: Collect Futures prices
        run: python collector.py

      - name: Technical Analysis
        run: python signal_scanner.py

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Update LBank Futures price history"
            git push
          else
            echo "No new data"
          fi
