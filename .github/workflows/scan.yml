
name: LBank Futures Smart Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lbank-market-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ابتدا مخزن را به‌روز می‌کنیم
      - name: Sync with remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

      # جمع‌آوری قیمت‌ها
      - name: Collect LBank Futures prices
        run: |
          python collector.py

      # تحلیل بازار با تأیید فیبوناچی
            # Futures-only Sniper safety gate
      - name: Run Futures Sniper
        run: |
          python sniper_entry.py

      # ارسال گزارش تلگرام
      https://api.telegram.org/bot{BOT_TOKEN}/sendMessage