      - name: Get Telegram Channel ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          url = f"https://api.telegram.org/bot{token}/getUpdates"

          response = requests.get(
              url,
              params={"allowed_updates": json.dumps(["channel_post", "message"])},
              timeout=20
          )

          print("HTTP STATUS:", response.status_code)
          data = response.json()
          print("TELEGRAM OK:", data.get("ok"))

          if not data.get("ok"):
              print("TELEGRAM ERROR:", data.get("description"))
          else:
              updates = data.get("result", [])
              print("UPDATES FOUND:", len(updates))

              for update in updates:
                  post = update.get("channel_post")
                  if post:
                      print("CHANNEL ID:", post["chat"]["id"])
                      print("CHANNEL TITLE:", post["chat"].get("title"))

                  if update.get("message"):
                      print("PRIVATE CHAT UPDATE RECEIVED")
          PY