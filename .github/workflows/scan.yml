name: LBank Futures Smart Scanner

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: lbank-market-data-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ابتدا مخزن را به‌روز می‌کنیم
      - name: Sync with remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"

      # جمع‌آوری قیمت‌ها
      - name: Collect LBank Futures prices
        run: |
          python collector.py

      # تحلیل بازار
      - name: Run smart scanner
        run: |
          python signal_scanner.py

      # ارسال گزارش تلگرام
      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import time
          import requests
          from pathlib import Path

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token or not chat_id:
              raise RuntimeError("Telegram secrets are missing")

          report_file = Path("report.txt")

          if not report_file.exists():
              raise RuntimeError("report.txt was not generated")

          report = report_file.read_text(encoding="utf-8").strip()

          if not report:
              raise RuntimeError("Telegram report is empty")

          max_length = 3800
          chunks = []
          current = ""

          for line in report.splitlines():
              if len(line) > max_length:
                  raise RuntimeError("A report line exceeds Telegram limit")

              candidate = current + "\n" + line if current else line

              if len(candidate) > max_length:
                  chunks.append(current)
                  current = line
              else:
                  current = candidate

          if current:
              chunks.append(current)

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for index, chunk in enumerate(chunks, start=1):
              prefix = f"📨 بخش {index}/{len(chunks)}\n\n" if len(chunks) > 1 else ""

              response = requests.post(
                  url,
                  json={
                      "chat_id": chat_id,
                      "text": prefix + chunk
                  },
                  timeout=30
              )

              response.raise_for_status()

              result = response.json()

              if not result.get("ok"):
                  raise RuntimeError(f"Telegram error: {result}")

              print(f"Telegram message {index}/{len(chunks)} sent")
              time.sleep(1)

          print(f"Successfully sent {len(chunks)} messages")
          PY

      # ذخیره امن داده‌های بازار
      - name: Commit and push market data
        run: |
          set -e

          git add data/prices.jsonl

          if git diff --cached --quiet; then
            echo "No market data changes"
            exit 0
          fi

          git commit -m "Update LBank futures market data"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt: ${attempt}"

            git fetch origin "${GITHUB_REF_NAME}"

            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "Rebase conflict detected"

              git rebase --abort || true

              echo "Manual inspection required. No force push attempted."
              exit 1
            fi

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Market data successfully pushed"
              exit 0
            fi

            sleep 3
          done

          echo "Push failed after 5 attempts"
          exit 1