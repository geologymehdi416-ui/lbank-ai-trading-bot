
name: LBank Futures WS Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependency
        run: python -m pip install websockets

      - name: Validate probe syntax
        run: python -m py_compile ws_probe.py

      - name: Confirm workflow loaded
        run: echo "Workflow YAML loaded and Python syntax is valid. No trading scan was started."
