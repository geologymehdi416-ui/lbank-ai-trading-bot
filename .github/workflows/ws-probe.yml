
name: LBank Futures WebSocket Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "ws_probe.py"
      - ".github/workflows/ws-probe.yml"

permissions:
  contents: read

jobs:
  websocket-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install WebSocket library
        run: |
          python -m pip install --upgrade pip
          pip install websockets

      - name: Validate Python
        run: |
          python -m py_compile ws_probe.py

      - name: Test LBank Futures WebSocket
        run: |
          python -u ws_probe.py
