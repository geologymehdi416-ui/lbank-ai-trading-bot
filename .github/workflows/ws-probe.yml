
name: LBank Futures WS Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install requests websockets

      - name: Discover Active BTC Futures Contracts
        run: |
          python - <<'PY'
          import requests
          import json

          BASE = "https://lbkperp.lbank.com"

          endpoints = [
              "instrument",
              "marketData"
          ]

          for endpoint in endpoints:
              url = f"{BASE}/cfd/openApi/v1/pub/{endpoint}"

              print(f"\n===== {endpoint} =====")

              try:
                  response = requests.get(
                      url,
                      params={"productGroup": "SwapU"},
                      timeout=20
                  )

                  print("HTTP:", response.status_code)

                  data = response.json()

                  print(
                      "ERROR:",
                      data.get("error_code")
                  )

                  print(
                      "MESSAGE:",
                      data.get("msg")
                  )

                  rows = data.get("data", [])

                  if isinstance(rows, dict):
                      rows = rows.get("data", [])

                  if isinstance(rows, list):
                      for item in rows:
                          text = json.dumps(item).upper()

                          if "BTC" in text:
                              print(
                                  json.dumps(
                                      item,
                                      indent=2,
                                      ensure_ascii=False
                                  )
                              )

              except Exception as e:
                  print("REQUEST_ERROR:", repr(e))
          PY

      - name: Subscribe to Futures KLine channels
        run: |
          python - <<'PY'
          import asyncio
          import json
          import websockets

          URL = "wss://lbkperpws.lbank.com/ws"

          async def main():
              try:
                  print("Connecting to LBank Futures...")

                  async with websockets.connect(
                      URL,
                      open_timeout=20,
                      close_timeout=5,
                      ping_interval=20,
                      ping_timeout=20
                  ) as ws:

                      print("HANDSHAKE_OK")

                      topics = ["11", "12", "13"]

                      for index, topic in enumerate(
                          topics,
                          start=1
                      ):
                          payload = {
                              "SendTopicAction": {
                                  "Action": "1",
                                  "LocalNo": index,
                                  "TopicID": topic,
                                  "FilterValue": "Exchange_BTCUSDT",
                                  "ResumeNo": -1
                              }
                          }

                          await ws.send(json.dumps(payload))

                          print(
                              f"SUBSCRIBE_SENT: TOPIC={topic}"
                          )

                      print("WAITING_FOR_KLINE_MESSAGES")

                      end_time = (
                          asyncio.get_running_loop().time() + 90
                      )

                      while (
                          asyncio.get_running_loop().time()
                          < end_time
                      ):
                          try:
                              msg = await asyncio.wait_for(
                                  ws.recv(),
                                  timeout=15
                              )

                              print(
                                  "RAW MESSAGE:",
                                  str(msg)[:5000]
                              )

                              if "PushKLine" in str(msg):
                                  print(
                                      "KLINE_MESSAGE_RECEIVED"
                                  )

                          except asyncio.TimeoutError:
                              print("STILL_WAITING_FOR_DATA")

                      print("PROBE_FINISHED")

              except Exception as e:
                  print(
                      "CONNECTION_ERROR:",
                      repr(e)
                  )

          asyncio.run(main())
          PY
